<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d2832">
<title>Clima Gold</title>
<style>
:root{
  --bg:#1d2832;
  --card:#fff;
  --text:#17212b;
  --muted:#68737d;
  --gold:#cfa333;
  --orange:#e58a1f;
  --light:#e9edf0;
  --auto:#f2c568;
  --icon:#46515b;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  display:grid;
  place-items:center;
  background:var(--bg);
  font-family:Arial,sans-serif;
  padding:20px;
}
.box{
  width:min(92vw,460px);
  background:var(--card);
  color:var(--text);
  border-radius:18px;
  padding:28px;
  box-shadow:0 20px 50px #0005;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:30px;
  font-weight:800;
  margin-bottom:8px;
  letter-spacing:-.5px;
}
.brandmark{
  width:28px;
  flex:0 0 28px;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.brandmark i{
  display:block;
  height:5px;
  background:var(--orange);
  border-radius:999px;
}
.brandmark i:nth-child(1){width:28px}
.brandmark i:nth-child(2){width:21px}
.brandmark i:nth-child(3){width:14px}
.clima{color:#72777d}
.gold{color:var(--orange)}
.muted{
  color:var(--muted);
  margin-bottom:18px;
  font-size:16px;
}
.tile{
  display:grid;
  grid-template-columns:58px 1fr 58px;
  align-items:center;
  text-decoration:none;
  border-radius:12px;
  padding:13px 14px;
  margin:7px 0;
  min-height:66px;
  color:#111;
  font-size:17px;
  font-weight:800;
  -webkit-tap-highlight-color:transparent;
}
.tile .label{
  text-align:center;
  letter-spacing:.1px;
}
.tile .icon{
  width:38px;
  height:38px;
  justify-self:center;
  color:var(--icon);
}
.tile svg{
  width:100%;
  height:100%;
  display:block;
  fill:currentColor;
  stroke:currentColor;
}
.e{background:var(--gold)}
.m{background:var(--light)}
.a{background:var(--auto)}
.spacer{width:38px;height:38px}
@media(max-width:420px){
  .box{padding:24px}
  .tile{grid-template-columns:52px 1fr 52px;font-size:16px;min-height:64px}
  .tile .icon{width:34px;height:34px}
}
</style>
</head>
<body>
<main class="box">
  <div class="brand">
    <span class="brandmark" aria-hidden="true"><i></i><i></i><i></i></span>
    <span><span class="clima">Clima</span><span class="gold">Gold</span></span>
  </div>

  <div class="muted">Ewidencja pracy online</div>

  <a class="tile e" href="./h1.html">
    <span class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M13.2 2 5.9 13.2h5.2L10.3 22l7.8-11.8h-5.4L13.2 2Z"/>
      </svg>
    </span>
    <span class="label">ELEKTRYCY H1</span>
    <span class="spacer"></span>
  </a>

  <a class="tile m" href="./montaz-h1.html">
    <span class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M22.2 5.8a6.5 6.5 0 0 1-8.3 7.8L6.1 21.4a2.1 2.1 0 0 1-3-3l7.8-7.8a6.5 6.5 0 0 1 7.8-8.3l-3.8 3.8 2.8 2.8 4.5-3.1ZM4.6 17.7a1.1 1.1 0 1 0 1.6 1.6 1.1 1.1 0 0 0-1.6-1.6Z"/>
      </svg>
    </span>
    <span class="label">MONTAŻ H1</span>
    <span class="spacer"></span>
  </a>

  <a class="tile a" href="./automatycy.html">
    <span class="icon" aria-hidden="true">
      <svg viewBox="0 0 48 48">
        <!-- zębatka -->
        <path d="M20 5h8l1.4 5.2 4.8 2.8 5.2-1.4 4 6.9-3.8 3.8v5.5l3.8 3.8-4 6.9-5.2-1.4-4.8 2.8L28 45h-8l-1.4-5.1-4.8-2.8-5.2 1.4-4-6.9 3.8-3.8v-5.5l-3.8-3.8 4-6.9 5.2 1.4 4.8-2.8L20 5Zm4 12a7 7 0 1 0 0 14 7 7 0 0 0 0-14Z"/>
        <!-- połączenia automatyki -->
        <path d="M35 16h4v2h-4zm0 7h6v2h-6zm0 7h4v2h-4z"/>
        <circle cx="42" cy="17" r="3" fill="none" stroke-width="2.5"/>
        <circle cx="44" cy="24" r="3" fill="none" stroke-width="2.5"/>
        <circle cx="42" cy="31" r="3" fill="none" stroke-width="2.5"/>
      </svg>
    </span>
    <span class="label">AUTOMATYCY</span>
    <span class="spacer"></span>
  </a>

  <a class="tile e" href="./h2.html">
    <span class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M13.2 2 5.9 13.2h5.2L10.3 22l7.8-11.8h-5.4L13.2 2Z"/>
      </svg>
    </span>
    <span class="label">ELEKTRYCY H2</span>
    <span class="spacer"></span>
  </a>

  <a class="tile m" href="./montaz-h2.html">
    <span class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M22.2 5.8a6.5 6.5 0 0 1-8.3 7.8L6.1 21.4a2.1 2.1 0 0 1-3-3l7.8-7.8a6.5 6.5 0 0 1 7.8-8.3l-3.8 3.8 2.8 2.8 4.5-3.1ZM4.6 17.7a1.1 1.1 0 1 0 1.6 1.6 1.1 1.1 0 0 0-1.6-1.6Z"/>
      </svg>
    </span>
    <span class="label">MONTAŻ H2</span>
    <span class="spacer"></span>
  </a>
</main>
</body>
</html>
